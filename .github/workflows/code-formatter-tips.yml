name: Code Formatter Tips

# Orquestación bi-semanal (Martes y Jueves 14:00 UTC) para Code Formatter & Auto-Doc AI.
# Ciclo idempotente en content/code-formatter-tips/code-formatter-manifest.json:
#   COMPILED -> DEPLOYED -> NOTIFIED
on:
  schedule:
    - cron: '0 14 * * 2,4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo validar y mostrar qué se publicaría (no escribe ni sube)'
        type: boolean
        default: false
      force_language:
        description: 'Lenguaje de programación opcional (python, javascript, typescript, sql, dax, java, csharp, php, json, yaml)'
        type: string
        required: false
        default: ''
      retry_social_only:
        description: 'Reintentar solo sindicación social/Dev.to/Discussions sin generar nuevo artículo ni enviar correos'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  discussions: write

concurrency:
  group: code-formatter-tips
  cancel-in-progress: false

jobs:
  publish:
    name: Generar, compilar y desplegar tip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
      slug: ${{ steps.publish.outputs.slug }}
      summary: ${{ steps.publish.outputs.summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias de build (gray-matter, resvg)
        run: npm install --no-save --no-package-lock gray-matter@4.0.3 @resvg/resvg-js@2.6.2

      - name: Generar tip bi-semanal con IA (si no hay borrador ready)
        if: ${{ (github.event_name == 'schedule' || inputs.dry_run != true) && inputs.retry_social_only != true }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_LANG: ${{ inputs.force_language }}
        run: |
          if [ -n "${FORCE_LANG:-}" ]; then
            node scripts/code-formatter/generate-weekly-tip.js --lang="$FORCE_LANG"
          else
            node scripts/code-formatter/generate-weekly-tip.js
          fi

      - name: Validar tips
        if: ${{ inputs.retry_social_only != true }}
        run: node scripts/validate-formatter-tips.js

      - name: Dry-run
        if: ${{ inputs.dry_run && inputs.retry_social_only != true }}
        run: node scripts/validate-formatter-tips.js --publish --dry-run

      - name: Publicar tip listo
        id: publish
        if: ${{ !inputs.dry_run && inputs.retry_social_only != true }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/validate-formatter-tips.js --publish --force
          else
            node scripts/validate-formatter-tips.js --publish
          fi

      - name: Generar imágenes OpenGraph (7 idiomas)
        if: ${{ !inputs.dry_run && inputs.retry_social_only != true && steps.publish.outputs.changed == 'true' }}
        run: node scripts/code-formatter/generate-og-images.js

      - name: Compilar páginas estáticas localizadas y sitemap
        if: ${{ !inputs.dry_run && inputs.retry_social_only != true && steps.publish.outputs.changed == 'true' }}
        run: python3 scripts/code-formatter/build_public.py

      - name: Ejecutar pruebas de Code Formatter
        if: ${{ inputs.retry_social_only != true }}
        run: |
          node scripts/code-formatter/test-growth-loops.mjs
          if ls tests/code-formatter/*.test.mjs >/dev/null 2>&1; then
            node --test tests/code-formatter/*.test.mjs
          fi

      - name: Verificar repositorio (después)
        if: ${{ !inputs.dry_run && inputs.retry_social_only != true && steps.publish.outputs.changed == 'true' }}
        run: node scripts/validate-formatter-tips.js

      - name: Commit y push
        if: ${{ !inputs.dry_run && inputs.retry_social_only != true && steps.publish.outputs.changed == 'true' }}
        env:
          PUBLISHED: ${{ steps.publish.outputs.summary }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content/code-formatter-tips tools/code-formatter sitemap-code-formatter.xml assets/images/og
          if git diff --cached --quiet; then
            echo "Sin cambios que confirmar para $PUBLISHED."
            exit 1
          fi
          git commit -m "chore(formatter-tips): publicar $PUBLISHED (automático)"
          git pull --rebase origin main
          git push origin main
          echo "Publicado: $PUBLISHED" >> "$GITHUB_STEP_SUMMARY"

      - name: Verificar despliegue público (HTTP 200 en 7 idiomas + sitemap)
        if: ${{ !inputs.dry_run && inputs.retry_social_only != true && steps.publish.outputs.slug != '' }}
        env:
          SLUG: ${{ steps.publish.outputs.slug }}
        run: node scripts/code-formatter/check-deployment.js "$SLUG"

      - name: Notificar IndexNow (7 URLs + sitemap)
        if: ${{ !inputs.dry_run && inputs.retry_social_only != true && steps.publish.outputs.slug != '' }}
        continue-on-error: true
        env:
          SLUG: ${{ steps.publish.outputs.slug }}
        run: node scripts/code-formatter/ping-indexnow.js "$SLUG"

      - name: Sindicar a Dev.to (canonical_url)
        if: ${{ !inputs.dry_run && (steps.publish.outputs.slug != '' || inputs.retry_social_only == true) }}
        continue-on-error: true
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: node scripts/code-formatter/syndicate-devto.js

      - name: Sindicar a Hashnode (originalArticleURL)
        if: ${{ !inputs.dry_run && (steps.publish.outputs.slug != '' || inputs.retry_social_only == true) }}
        continue-on-error: true
        env:
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
        run: node scripts/code-formatter/syndicate-hashnode.js

      - name: Difusión social (Bluesky, Mastodon, Telegram, Discord, GitHub Discussions)
        if: ${{ !inputs.dry_run && (steps.publish.outputs.slug != '' || inputs.retry_social_only == true) }}
        continue-on-error: true
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          MASTODON_INSTANCE_URL: ${{ secrets.MASTODON_INSTANCE_URL }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/code-formatter/syndicate-social.js

      - name: Generar Kit de Distribución Regional (7 idiomas)
        if: ${{ !inputs.dry_run && (steps.publish.outputs.slug != '' || inputs.retry_social_only == true) }}
        continue-on-error: true
        env:
          SLUG: ${{ steps.publish.outputs.slug }}
        run: |
          if [ -n "${SLUG:-}" ]; then
            node scripts/code-formatter/generate-distribution-kit.js --slug "$SLUG"
          else
            node scripts/code-formatter/generate-distribution-kit.js
          fi

      - name: Registrar estado DEPLOYED en manifiesto
        if: ${{ !inputs.dry_run && (steps.publish.outputs.slug != '' || inputs.retry_social_only == true) }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/code-formatter-tips/code-formatter-manifest.json content/code-formatter-tips/distribution/
          if ! git diff --cached --quiet; then
            git commit -m "chore(formatter-tips): marcar DEPLOYED (automático)"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Notificar fallo del workflow
        if: ${{ failure() && env.DISCORD_WEBHOOK_URL != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node -e '
            const url = process.env.DISCORD_WEBHOOK_URL;
            const runUrl = process.env.RUN_URL;
            fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                embeds: [{
                  title: "❌ Fallo en Code Formatter Tips",
                  description: `El pipeline falló. Revisa los logs del run:\n${runUrl}`,
                  color: 15158332
                }]
              })
            }).then(r => { if (!r.ok) process.exit(1); });
          '

  notify:
    name: Notificar suscriptores (canal code-formatter)
    needs: publish
    if: ${{ needs.publish.result == 'success' && needs.publish.outputs.slug != '' && !inputs.dry_run && inputs.retry_social_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Enviar notificación al canal code-formatter
        env:
          SLUG: ${{ needs.publish.outputs.slug }}
          NEWSLETTER_WEBHOOK_URL: ${{ secrets.NEWSLETTER_WEBHOOK_URL }}
          NEWSLETTER_WEBHOOK_TOKEN: ${{ secrets.NEWSLETTER_WEBHOOK_TOKEN }}
        run: |
          if [ -z "${NEWSLETTER_WEBHOOK_URL:-}" ]; then
            echo "::warning::NEWSLETTER_WEBHOOK_URL no configurado. Tip $SLUG permanece DEPLOYED sin notificar."
            exit 0
          fi
          node scripts/code-formatter/notify-newsletter.js "$SLUG" || echo "::warning::Fallo al notificar newsletter; el tip $SLUG permanece DEPLOYED."

      - name: Registrar estado NOTIFIED en manifiesto
        if: ${{ always() }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/code-formatter-tips/code-formatter-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(formatter-tips): marcar NOTIFIED (automático)"
            git pull --rebase origin main
            git push origin main
          fi

  alert:
    name: Alerta de fallo
    needs: [publish, notify]
    if: ${{ always() && !inputs.dry_run && (needs.publish.result == 'failure' || needs.notify.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Abrir incidencia en GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUBLISH: ${{ needs.publish.result }}
          NOTIFY: ${{ needs.notify.result }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --label "automation-alert,code-formatter" \
            --title "Code Formatter Tips falló ($(date -u +%F))" \
            --body "publish=$PUBLISH, notify=$NOTIFY. Detalle: $RUN_URL" || \
          gh issue create --repo "${{ github.repository }}" \
            --title "Code Formatter Tips falló ($(date -u +%F))" \
            --body "publish=$PUBLISH, notify=$NOTIFY. Detalle: $RUN_URL"
