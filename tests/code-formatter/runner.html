<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Code Formatter — suite de pruebas</title>
  <style>body{font:14px/1.5 Consolas,monospace;background:#0b0f17;color:#e5e7eb;padding:20px}.ok{color:#86efac}.fail{color:#fca5a5}</style>
</head>
<body>
  <h1>Code Formatter — suite de pruebas</h1>
  <p>Ejecutar desde un servidor estático en la raíz del proyecto: <code>/tests/code-formatter/runner.html</code>. Resultado en <code>window.__results</code>.</p>
  <pre id="out">Ejecutando…</pre>
  <script type="module">
    import { FIXTURES, INVALID } from './fixtures.js';
    import { formatCode } from '../../assets/js/tools/code-formatter/formatters.js';
    import { detectLanguage } from '../../assets/js/tools/code-formatter/detect.js';
    import { addDocs, DOC_SUPPORTED } from '../../assets/js/tools/code-formatter/doc-generator.js';
    import { toMarkdown } from '../../assets/js/tools/code-formatter/actions.js';
    import { DOC_LANGUAGES } from '../../config/documentation-languages.js';

    const results = [];
    const out = document.getElementById('out');
    const check = async (name, fn) => {
      try { const detail = await fn(); results.push({ name, ok: true, detail }); }
      catch (e) { results.push({ name, ok: false, detail: String(e.message || e) }); }
    };
    const eq = (a, b, msg) => { if (a !== b) throw new Error(`${msg}\n--- esperado\n${b}\n--- obtenido\n${a}`); };

    for (const f of FIXTURES) {
      await check(`[${f.lang}] formato idempotente (f(f(x)) == f(x))`, async () => {
        const r1 = await formatCode(f.src, f.lang);
        const r2 = await formatCode(r1.code, f.lang);
        eq(r2.code, r1.code, 'la segunda pasada alteró el resultado');
        return r1.engine;
      });
      await check(`[${f.lang}] el formateo produce cambios y no vacía el código`, async () => {
        const r = await formatCode(f.src, f.lang);
        if (!r.code.trim()) throw new Error('resultado vacío');
        if (r.code === f.src) throw new Error('el fixture ya estaba formateado (fixture inválido)');
      });
      await check(`[${f.lang}] sintaxis válida tras formatear (${f.syntax})`, async () => {
        const r = await formatCode(f.src, f.lang);
        if (f.syntax === 'json') JSON.parse(r.code);
        else if (f.syntax === 'normalize') { if (/[ \t]+$/m.test(r.code) || /\t/.test(r.code) || !r.code.endsWith('\n')) throw new Error('quedaron tabs/espacios finales/sin salto final'); }
        else await formatCode(r.code, f.lang); // Prettier / sql-formatter aceptan su propia salida
      });
      await check(`[${f.lang}] auto-detección`, async () => {
        const d = detectLanguage(f.src);
        // C# y Java comparten sintaxis; dax puede confundirse con sql: se informa pero solo falla en el resto
        if (d !== f.lang && !['csharp', 'java', 'dax', 'php'].includes(f.lang)) throw new Error(`detectó ${d}`);
        return `detectó ${d}`;
      });
    }

    for (const f of INVALID) {
      await check(`[${f.lang}] sintaxis inválida es rechazada`, async () => {
        try { await formatCode(f.src, f.lang); } catch { return 'error lanzado'; }
        throw new Error('no lanzó error');
      });
    }

    for (const lang of ['python', 'javascript', 'typescript']) {
      const f = FIXTURES.find((x) => x.lang === lang);
      for (const docLang of Object.keys(DOC_LANGUAGES)) {
        for (const level of ['basic', 'extended']) {
          await check(`[${lang}] docs ${docLang}/${level} idempotentes tras formatear`, async () => {
            const base = (await formatCode(f.src, lang)).code;
            const d1 = addDocs(base, lang, docLang, level);
            if (d1.count < 1) throw new Error('no generó documentación');
            const d2 = addDocs(d1.code, lang, docLang, level);
            eq(d2.code, d1.code, 'segunda pasada duplicó documentación');
            if (d2.count !== 0) throw new Error(`segunda pasada añadió ${d2.count}`);
            const again = (await formatCode(d1.code, lang)).code;
            eq(again, d1.code, 'formatear de nuevo alteró el código documentado');
          });
        }
      }
    }
    await check('docs: lenguajes no soportados no se modifican', async () => {
      for (const l of ['sql', 'json', 'java']) { if (DOC_SUPPORTED.has(l)) throw new Error(l); eq(addDocs('x', l).code, 'x', l); }
    });
    await check('Markdown: valla más larga que cualquier ``` interno', async () => {
      eq(toMarkdown('a\n```\nb\n', 'python'), '````python\na\n```\nb\n````\n', 'valla incorrecta');
    });

    // --- i18n: paridad de claves entre los 7 idiomas (interfaz y textos PRO) y separación de idiomas
    const UI = ['es', 'en', 'pt-BR', 'pt-PT', 'fr', 'de', 'it'];
    const keysOf = (o) => Object.keys(o).sort();
    const vars = (s) => (s.match(/\{\w+\}/g) || []).sort().join();
    for (const dir of ['locales', 'locales-pro']) {
      const base = (await import(`../../assets/js/tools/code-formatter/${dir}/es.js`)).default;
      for (const l of UI.filter((x) => x !== 'es')) {
        await check(`i18n ${dir}/${l}: mismas claves y variables que es`, async () => {
          const m = (await import(`../../assets/js/tools/code-formatter/${dir}/${l}.js`)).default;
          eq(keysOf(m).join(), keysOf(base).join(), 'claves distintas');
          for (const k of Object.keys(base)) {
            if (!String(m[k]).trim()) throw new Error(`vacío: ${k}`);
            eq(vars(m[k]), vars(base[k]), `variables distintas en ${k}`);
          }
        });
      }
    }
    await check('i18n: configuración de idiomas de DOCUMENTACIÓN cubre los 7 y comparte claves', async () => {
      const keys = keysOf(DOC_LANGUAGES.es).join();
      for (const l of UI) { if (!DOC_LANGUAGES[l]) throw new Error(`falta ${l}`); eq(keysOf(DOC_LANGUAGES[l]).join(), keys, `claves de ${l}`); }
    });

    // --- Adaptador JSON
    const { analyzeJson, buildDocumentation, toMarkdownDoc, utf8Bytes } = await import('../../assets/js/tools/code-formatter/json-documentation-adapter.js');
    const SAMPLE = '{"id":1,"name":"Ñandú €","tags":["a","b"],"owner":{"name":"x","active":true,"score":null},"items":[{"sku":"A","qty":2},{"sku":"B","qty":"3"}]}';
    await check('JSON: rechaza sintaxis inválida (RFC 8259: sin comas finales ni comentarios)', async () => {
      for (const bad of ['{"a":1,}', '{"a":1} // c', "{'a':1}", '']) if (analyzeJson(bad).valid) throw new Error(`aceptó ${bad}`);
    });
    await check('JSON: conteo de objetos, arrays, propiedades, profundidad y tipos', async () => {
      const a = analyzeJson(SAMPLE);
      eq(a.valid, true, 'inválido'); eq(a.root, 'object', 'raíz');
      eq(a.stats.objects, 4, 'objetos'); eq(a.stats.arrays, 2, 'arrays'); eq(a.stats.properties, 12, 'propiedades'); eq(a.stats.maxDepth, 3, 'profundidad');
      const p = Object.fromEntries(a.properties.map((x) => [x.path, x]));
      eq(p['items[].qty'].types.join(), 'number,string', 'tipos mixtos'); eq(p['items[].qty'].count, 2, 'apariciones'); eq(p['owner.score'].types.join(), 'null', 'null');
    });
    await check('JSON: tamaño en bytes UTF-8 reales (no caracteres)', async () => {
      eq(analyzeJson(SAMPLE).stats.bytes, utf8Bytes(SAMPLE), 'bytes'); if (utf8Bytes('Ñ€') !== 5) throw new Error('utf8Bytes');
    });
    await check('JSON: documentación en el idioma de documentación; el texto original no se modifica', async () => {
      const a = analyzeJson(SAMPLE);
      const de = buildDocumentation(a, 'de', 'extended'), es = buildDocumentation(a, 'es', 'basic');
      eq(de.title, DOC_LANGUAGES.de.docTitle, 'título de'); eq(es.properties[0].description, `${DOC_LANGUAGES.es.property}.`, 'descripción es');
      if (!de.properties.some((x) => 'example' in x)) throw new Error('extended sin ejemplos'); if (es.properties.some((x) => 'example' in x)) throw new Error('basic con ejemplos');
      const md = toMarkdownDoc(de, 'de'); if (!md.includes(`## ${DOC_LANGUAGES.de.docProperties}`) || !md.includes('`items[].sku`')) throw new Error('markdown incompleto');
      eq(JSON.parse(SAMPLE).id, 1, 'entrada intacta');
    });
    await check('JSON: Markdown escapa | y saltos de línea en celdas', async () => {
      const md = toMarkdownDoc(buildDocumentation(analyzeJson('{"a|b":"x\\ny"}'), 'en', 'extended'), 'en');
      if (!md.includes('`a\\|b`')) throw new Error(md);
    });

    // --- Historial enriquecido
    const H = await import('../../assets/js/tools/code-formatter/history.js');
    await check('historial: bytes UTF-8, líneas, resultado, id y tope de 5', async () => {
      H.clearHistory();
      for (let i = 0; i < 7; i++) H.pushHistory(`línea ${i}€\nsegunda`, 'python', 'formatted_documented');
      const list = H.loadHistory();
      eq(list.length, 5, 'tope'); eq(list[0].lines, 2, 'líneas'); eq(list[0].bytes, new TextEncoder().encode('línea 6€\nsegunda').length, 'bytes'); eq(list[0].result, 'formatted_documented', 'resultado');
      if (!list[0].id || new Set(list.map((x) => x.id)).size !== 5) throw new Error('ids');
    });
    await check('historial: eliminación individual y global', async () => {
      const [a, b] = H.loadHistory();
      const after = H.removeHistoryItem(a.id);
      eq(after.length, 4, 'quitar uno'); if (after.some((x) => x.id === a.id) || !after.some((x) => x.id === b.id)) throw new Error('quitó otro');
      eq(H.clearHistory().length, 0, 'vaciar'); eq(H.loadHistory().length, 0, 'persistencia');
    });
    await check('historial: migra registros antiguos y descarta basura', async () => {
      localStorage.setItem('cf.history', JSON.stringify([{ ts: 1, lang: 'sql', code: 'select 1' }, { nope: true }, null, 'x']));
      const list = H.loadHistory(); eq(list.length, 1, 'solo el válido'); eq(list[0].bytes, 8, 'bytes'); eq(list[0].result, 'formatted_success', 'resultado por defecto'); H.clearHistory();
    });
    await check('historial: JSON corrupto no rompe', async () => { localStorage.setItem('cf.history', '{{{'); eq(H.loadHistory().length, 0, 'vacío'); H.clearHistory(); });

    const failed = results.filter((r) => !r.ok);
    window.__results = { total: results.length, passed: results.length - failed.length, failed: failed.length, failures: failed, all: results };
    out.innerHTML = results.map((r) => `<div class="${r.ok ? 'ok' : 'fail'}">${r.ok ? '✔' : '✘'} ${r.name}${r.ok ? '' : '\n   ' + r.detail}</div>`).join('') +
      `<h2 class="${failed.length ? 'fail' : 'ok'}">${results.length - failed.length}/${results.length} OK</h2>`;
    window.__done = true;
  </script>
</body>
</html>
