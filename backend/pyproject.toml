[project]
name = "jw-solutions-backend"
version = "0.1.0"
description = "JW Solutions API, workers IMAP/expiración/outbox (Code Formatter & Auto-Doc AI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "python-dateutil>=2.9",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-mock>=3.14",
    "httpx>=0.27",
    "freezegun>=1.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
